name: Logistics Clean Reset 2026-08-01

on:
  push:
    paths:
      - ".github/workflows/run-logistics-clean-reset-2026-08-01.yml"
  workflow_dispatch:

concurrency:
  group: logistics-clean-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STREAMLIT_SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
      LOGISTICS_RESET_CONFIRM: RESET_LOGISTICS_FROM_CURRENT_TAWSEEL_2026_08_01

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate production secrets
        shell: bash
        run: |
          if [ -z "$STREAMLIT_SECRETS_TOML" ]; then
            echo "Missing repository secret: STREAMLIT_SECRETS_TOML"
            exit 1
          fi

      - name: Archive, reset, rebuild and verify logistics
        run: python scripts/reset_logistics_from_current_tawseel.py
