name: Logistics Auto Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even when a recent successful sync exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: logistics-auto-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STREAMLIT_SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
      LOGISTICS_SYNC_SOURCE: github_actions
      LOGISTICS_SYNC_MIN_INTERVAL_SECONDS: "300"
      LOGISTICS_SYNC_LEASE_MINUTES: "20"
      LOGISTICS_SYNC_MAX_ATTEMPTS: "4"
      LOGISTICS_SYNC_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate production secrets
        shell: bash
        run: |
          if [ -z "$STREAMLIT_SECRETS_TOML" ]; then
            echo "Missing repository secret: STREAMLIT_SECRETS_TOML"
            exit 1
          fi

      - name: Sync critical and updated Tawseel orders
        run: python scripts/automated_logistics_sync.py
