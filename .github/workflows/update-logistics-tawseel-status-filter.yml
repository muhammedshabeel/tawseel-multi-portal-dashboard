name: Update Logistics Tawseel Status Filter

on:
  push:
    paths:
      - ".github/workflows/update-logistics-tawseel-status-filter.yml"

permissions:
  contents: write

jobs:
  update-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy focus filter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/logistics_kanban_compact.py")
          content = path.read_text(encoding="utf-8")

          select_pattern = re.compile(
              r'''        focus = focus_col\.selectbox\(\n'''
              r'''            "Focus",\n'''
              r'''            \[\n'''
              r'''(?:.*\n)*?'''
              r'''            \],\n'''
              r'''            key=f"kanban_focus_\{agent\}",\n'''
              r'''        \)\n''',
          )
          replacement_select = '''        status_values = (
            visible_all.get(
                "Latest Courier Status",
                pd.Series("", index=visible_all.index, dtype=str),
            )
            .fillna("")
            .astype(str)
            .str.strip()
        )
        status_by_key: dict[str, str] = {}
        for value in status_values.tolist():
            if value:
                status_by_key.setdefault(value.casefold(), value)
        tawseel_statuses = sorted(status_by_key.values(), key=str.casefold)
        focus = focus_col.selectbox(
            "Tawseel status",
            ["All Tawseel statuses", *tawseel_statuses],
            key=f"kanban_focus_{agent}",
        )
'''
          content, select_count = select_pattern.subn(replacement_select, content, count=1)
          if select_count != 1:
              raise SystemExit(f"Expected one legacy Focus selectbox, found {select_count}.")

          filter_pattern = re.compile(
              r'''    board_masks = logistics_case_masks\(board_cases\)\n'''
              r'''(?:.*\n)*?'''
              r'''    if query\.strip\(\):\n''',
          )
          replacement_filter = '''    if focus != "All Tawseel statuses":
        latest_status = board_cases.get(
            "Latest Courier Status",
            pd.Series("", index=board_cases.index, dtype=str),
        ).fillna("").astype(str).str.strip()
        board_cases = board_cases[
            latest_status.str.casefold().eq(focus.casefold())
        ].copy()

    if query.strip():
'''
          content, filter_count = filter_pattern.subn(replacement_filter, content, count=1)
          if filter_count != 1:
              raise SystemExit(f"Expected one legacy focus-filter block, found {filter_count}.")

          path.write_text(content, encoding="utf-8")
          PY

      - name: Verify exact source result
        shell: bash
        run: |
          python -m py_compile src/logistics_kanban_compact.py
          grep -n '"Tawseel status"' src/logistics_kanban_compact.py
          grep -n '"All Tawseel statuses"' src/logistics_kanban_compact.py
          if grep -n '"Focus"' src/logistics_kanban_compact.py; then
            echo "Legacy Focus label remains."
            exit 1
          fi
          if grep -n 'elif focus == "RTO Converted"' src/logistics_kanban_compact.py; then
            echo "Legacy RTO Converted dropdown filter remains."
            exit 1
          fi

      - name: Commit actual source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/logistics_kanban_compact.py
          git commit -m "Replace logistics focus with Tawseel status filter"
          git push
